name: CICD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Non-secret settings at the top of the workflow (secrets stay in the production environment)
env:
  IMAGE: ghcr.io/pinghsuanc/project-postie98
  SSH_HOST: ssh-postie98.pinghsuan.dev
  API_URL: https://postie98.pinghsuan.dev

permissions:
  contents: read
  

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      HMAC_SECRET: ci-test-secret        # CI has no .env; use your real variable name
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  publish:
    needs: [ruff, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: [publish]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      - name: Deploy through Cloudflare
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_CLIENT_ID_CD }}
          CF_SECRET: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_CLIENT_SECRET_CD }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o ProxyCommand="cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET" \
            ubuntu@${{ env.SSH_HOST }} \
            'cd ~/postie98 && docker compose pull && docker compose up -d'
      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 3 ${{ env.API_URL }}/health \
            -H "CF-Access-Client-Id: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_CLIENT_ID_CD }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_CLIENT_SECRET_CD }}"