name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      HMAC_SECRET: ci-test-secret        # CI has no .env; use your real variable name
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  merge:
    needs: [ruff, test]                  # only merges if BOTH pass
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Delete the PR's branch once it's merged (only branches in this repo, never main).
      # Done here, not in a separate "on: closed" workflow: a merge made with
      # GITHUB_TOKEN does not trigger other workflows.
      - name: Delete merged branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'main'
        run: |
          if gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"; then
            echo "Deleted branch $BRANCH"
          else
            echo "Branch $BRANCH already gone or could not be deleted; skipping."
          fi
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}